name: Feature
description: New or changed behaviour of the format, a skill, the agent, or the website.
labels: ["type:feature"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Format (a change to what a HARNESS.md is)"
        - "Plugin: skill"
        - "Plugin: agent"
        - "Website"
        - "Several"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What an author of a HARNESS.md, or a user of the plugin, cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you want, in terms of what a file may contain or what the agent does. Implementation details belong in the OpenSpec design.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes a reviewer can judge; they become the OpenSpec scenarios.
    validations:
      required: true
