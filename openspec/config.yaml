schema: spec-driven

# Project context: constraints an agent cannot infer from the code.
context: |
  This repository is harness.md: the HARNESS.md format specification, the
  official hub of ready-to-use HARNESS.md designs, the website, and
  harness-md, an Agent Plugins v1.0.0 plugin that designs, builds, extracts,
  and audits agent harnesses around a HARNESS.md file.
  Long-lived specs are organised by domain under openspec/specs/:
  - format/document, format/frontmatter, format/sections: the structured
    statement of the HARNESS.md format. spec/spec.md (English, with the
    Chinese mirror spec/spec.zh.md) is prose written from these three specs
    and is the only source outside readers are pointed to. A format change
    updates these specs first and the prose in the same change; nothing checks
    the two mechanically, so the reviewer does.
  - cli/spec.md and cli/lint/spec.md: the validator. Its conformance cases are
    spec/fixtures/ with spec/fixtures/expected.json; both implementations
    (scripts/lint_harness_md.ts for this repository, the Python script inside
    skills/harness-md for users) must pass them.
  - skill/spec.md holds the rules every shipped skill follows and
    skill/<name>/spec.md describes one skill; agent/spec.md and
    agent/<name>/spec.md do the same for agents (Claude Code only today).
    Every shipped entry has exactly one spec and every spec exactly one
    entry; `just validate` enforces the pairing.
  - hub/spec.md: the rules a hub entry follows. Adding or changing an entry
    under hub/ is an ordinary pull request with no OpenSpec change.
  - site/spec.md: one simple spec for the website.
  A change to the harness, scripts, CI, documentation, hub entries, site
  styling or copy, or generated client files is spec-less; one opened for a
  recorded design sets skip_specs: true in its .openspec.yaml and ships
  proposal, design, and tasks only.
  An entry spec's scenarios are the entry's behavioural test cases; they run
  by hand through clean-context subagents, never in CI.
  Write every artifact in English. Read .agents/knowledge/skill-quality.md
  and .agents/knowledge/plugin-architecture.md before writing a spec for a
  skill.

rules:
  proposal:
    - State which domains (format, cli, skill, agent, hub, site) and which
      clients the change touches, and name every entry that is added, changed,
      or removed; link the GitHub issue.
    - Describe the end state, never the approach or steps.
    - 'End with "## Acceptance" holding two lists of checkable items, "**Becomes true:**" and "**Stays true:**" (invariants that must hold under any approach); each item is checkable by a command, a client walkthrough, or a spec scenario.'
    - A format change states whether existing conforming files stay
      conforming, and names the fixtures it adds or changes.
  specs:
    - A catalog-level spec states rules only; it never describes one entry.
    - An entry spec's Purpose names the clients the entry ships to and any
      client where it is not shipped, with the reason, and lists the entry's
      non-goals.
    - Describe observable behaviour (what the agent does or produces when the
      entry loads, what a validator reports), never file contents or
      implementation steps.
    - Keep each requirement's text under 500 characters; move cases into
      scenarios or split the requirement.
    - Every requirement has at least one scenario a reader can judge without
      reading the implementation, and the spec as a whole has at least one
      scenario covering a failure or edge path.
    - A skill spec carries its behavioural test cases as scenarios in two
      requirements, "Triggering" (at least three prompts that load it and
      three near misses that do not; no prompt names the skill) and
      "Outcomes" (at least two tasks with the observable result expected).
    - 'Scenario names carry no value ("Omitted version", not "Latest by default") so a MODIFIED requirement keeps every scenario name.'
  design:
    - Describe how the proposal's end state is reached; never restate its goal
      or acceptance.
    - 'Put in Goals / Non-Goals the constraints and invariants of the chosen approach, each with how it is checked ("Checked by …").'
    - A format change lists the edits to spec/spec.md and spec/spec.zh.md, to
      both validator implementations, to spec/fixtures/, and to the copy of
      the specification inside skills/harness-md.
    - List the client-specific files the change needs under each com.*
      directory and which of them `just gen` produces.
    - Record decisions with the rejected alternatives; state bounds, not
      steps; never include secrets or private data.
  tasks:
    - Write tasks.md only after the pull request carries `spec:approved`, read
      with `just pr-labels <n>`; otherwise stop and report that the approval
      package is ready for review.
    - Each task names its own verification; a skill task names the scenarios
      it closes.
    - End with `just gen`, `just skills-check`, `just check`, the behavioural
      tests, and `just clients-validate`; include them as the last tasks.
    - Never add a task that archives the change or syncs specs by itself;
      the implementer archives on the pull request after the review.

operations:
  apply:
    guidance:
      - Implement only while the pull request carries `spec:approved`
        (`just pr-labels <n>`); otherwise stop and ask.
      - Implement one task at a time and keep `just check` green between tasks.
  archive:
    guidance:
      - Archive only after `just check` passes, the behavioural tests are
        recorded, and the maintainer approved the pull request and asked for
        the archive in the current conversation.
