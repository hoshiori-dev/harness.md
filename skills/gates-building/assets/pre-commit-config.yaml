# Runs on every commit, agent checkpoints included. Budget: seconds; slower
# checks run in CI and in the full recipe. The secret scan never leaves
# this file and is never skipped with --no-verify. The first two hooks are
# always present; add no other hook the design does not name.
repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: secret scan (betterleaks, staged files)
        entry: betterleaks dir --no-banner --redact # CONFIGURE: the design's scanner
        language: system
        pass_filenames: true
      - id: format
        name: format (ruff format)
        entry: ruff format --quiet # CONFIGURE: the design's formatter, write mode
        language: system
        types: [python] # CONFIGURE: the formatter's file types
      # Each of the following only when the design names it and it fits the budget.
      - id: lint
        name: lint (ruff check)
        entry: ruff check --output-format concise --quiet # CONFIGURE: the design's linter
        language: system
        types: [python] # CONFIGURE: the linter's file types
      - id: typecheck
        name: typecheck (pyright)
        entry: pyright # CONFIGURE: the design's typechecker
        language: system
        pass_filenames: false
        types: [python] # CONFIGURE: run only when these file types are staged
      - id: boundaries
        name: architecture boundaries
        entry: python3 scripts/check_boundaries.py # CONFIGURE: the delivered check and its runtime
        language: system
        types_or: [python, ts, tsx, javascript] # CONFIGURE: the languages the check reads
