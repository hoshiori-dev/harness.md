repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-json
        exclude: '(^|/)devcontainer\.json$|\.jsonc$|(^|/)tsconfig\.json$'
      - id: check-yaml
        exclude: '^pnpm-lock\.yaml$'
      - id: check-toml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: biome-check
        name: biome check (format, lint, import order)
        entry: pnpm exec biome check
        language: system
        pass_filenames: false
      - id: tsc
        name: tsc --noEmit (management scripts)
        entry: pnpm exec tsc --noEmit
        language: system
        pass_filenames: false
        files: ^(scripts/.*\.ts|tsconfig\.json)$
      - id: gen-check
        name: generated client files are current (just gen --check)
        entry: just gen --check
        language: system
        pass_filenames: false
        always_run: true
      - id: skills-check
        name: shipped skills pass the quality bar (just skills-check)
        entry: just skills-check
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check (shipped Python assets)
        entry: uvx ruff@0.15.0 check --extend-select BLE001,S110
        language: system
        files: ^skills/.*\.py$
      - id: ruff-format
        name: ruff format --check (shipped Python assets)
        entry: uvx ruff@0.15.0 format --check
        language: system
        files: ^skills/.*\.py$
      - id: betterleaks
        name: betterleaks (secrets in staged files)
        entry: betterleaks dir --no-banner --redact
        language: system
        pass_filenames: true
